# ac-net-run01: Pod/Service test fixtures for P1-K8S-01 (#10) T07/T08/T09/T14/T15.
# Create-only fixtures in ONE namespace; cleanup deletes only this namespace (bound to its UID).
# The fixed image digest is already present on each worker. On worker02/03 kubelet (v1.36) answered imagePullPolicy Never with
# ErrImageNeverPull (2026-10-05) while its image_manager record lists fds-app/harbor-pull-secret and fds-gate2-probe/harbor-pull-secret
# for this image (worker01 has no such record); this is the observed cause candidate, confirmed only by running the test.
# So the Pods carry imagePullSecrets (a copy of fds-app/harbor-pull-secret made by acnet-1, removed with the namespace) and
# imagePullPolicy IfNotPresent. IfNotPresent may send a registry authentication request and, if kubelet decides it must, pull that
# digest; it is NOT guaranteed to use only the local cache.
apiVersion: v1
kind: Namespace
metadata:
  name: ac-net-run01
  labels:
    pod-security.kubernetes.io/enforce: restricted
    fds.test/run: ac-net-run01
---
apiVersion: v1
kind: Pod
metadata:
  name: probe-a
  namespace: ac-net-run01
  labels:
    app: probe-a
    fds.test/run: ac-net-run01
spec:
  nodeSelector:
    kubernetes.io/hostname: k8s-worker01
  automountServiceAccountToken: false
  imagePullSecrets:
  - name: harbor-pull-secret
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: http
    image: 10.1.93.54/fds/transaction-api@sha256:a7093136d12640da00570c18ed278eacbb8e9ba3637c7d509571346eac45cc33
    imagePullPolicy: IfNotPresent
    command: [python3, -m, http.server, '8080', --bind, 0.0.0.0]
    workingDir: /tmp
    ports:
    - containerPort: 8080
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {cpu: 100m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: probe-a-svc
  namespace: ac-net-run01
  labels:
    fds.test/run: ac-net-run01
spec:
  type: ClusterIP
  selector:
    app: probe-a
  ports:
  - port: 80
    targetPort: 8080
---
apiVersion: v1
