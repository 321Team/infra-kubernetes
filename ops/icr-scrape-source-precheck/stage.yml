---
- name: Execute bounded collector from stdin
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -I
      - -B
      - -c
      - "import sys,hashlib; s=sys.stdin.buffer.read(); exec(compile(s,'<icr-scrape-source>','exec'),{'__name__':'__main__','SOURCE_SHA256':hashlib.sha256(s).hexdigest()})"
      - "{{ icr_phase }}"
    stdin: "{{ lookup('ansible.builtin.file', playbook_dir + '/collect.py', rstrip=False) }}"
    stdin_add_newline: false
  register: icr_collection
  changed_when: false
  failed_when: false
  no_log: true
- name: Preserve output on ansible01 only
  ansible.builtin.copy:
    dest: "{{ icr_output_dir }}/{{ inventory_hostname }}-{{ icr_phase }}.json"
    mode: '0600'
    content: >-
      {{ {'source_sha': icr_source_sha,
           'collector_sha256': lookup('ansible.builtin.file', playbook_dir + '/collect.py', rstrip=False) | hash('sha256'),
           'target': inventory_hostname, 'ansible_host': ansible_host, 'ansible_user': ansible_user,
           'rc': icr_collection.rc, 'stdout': icr_collection.stdout, 'stderr': icr_collection.stderr}
         | to_nice_json }}
  delegate_to: localhost
  no_log: true
- name: Stop on identity, access or observation failure
  ansible.builtin.assert:
    that: icr_collection.rc == 0
    fail_msg: "STOP: return the bundle; no tool installation, access or policy changes."
