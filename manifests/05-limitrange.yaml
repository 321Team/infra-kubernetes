# P1-SEC-01 / D-SEC-01 §5(Resource) 반영 — LimitRange 신설.
#
# D-SEC-01 결정: "설정 누락으로 인한 자원 고갈을 예방하기 위해 대상 Namespace
# (fds-app, monitoring-node, monitoring-api)에는 LimitRange 리소스를 배포하여
# Request/Limit 기본값(Default)이 자동 적용되도록 구성한다."
#
# 현재 02-securitycontext.yaml에는 transaction-api/fds-engine에만 명시적
# resources가 있고, Prometheus/Alertmanager/Grafana/kube-state-metrics/
# node-exporter 5개 워크로드는 explicit request/limit이 없다. 이 LimitRange는
# 그 공백에 대한 안전망(default)이며, D-SEC-01 원칙대로 "명시적 값의 대체재"가
# 아니다 — 실제 사이징(특히 Prometheus TSDB)은 P1-APP-01/P1-MON-01 부하 테스트
# 결과로 확정해 각 Deployment에 명시적 resources를 반영해야 한다.
---
apiVersion: v1
kind: LimitRange
metadata:
  name: fds-app-default-limits
  namespace: fds-app
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: "250m"
        memory: "256Mi"
      default:
        cpu: "500m"
        memory: "512Mi"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: monitoring-api-default-limits
  namespace: monitoring-api
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: "200m"
        memory: "256Mi"
      default:
        cpu: "500m"
        memory: "512Mi"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: monitoring-node-default-limits
  namespace: monitoring-node
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: "50m"
        memory: "64Mi"
      default:
        cpu: "100m"
        memory: "128Mi"
