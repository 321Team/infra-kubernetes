# P1-SEC-01 / SEC-06 (Critical) 수정 — Calico HostEndpoint interfaceName이
# 실측 NIC와 연결되지 않던 문제, Bootstrap/failsafe/복구 절차 누락 문제 교정.
#
# 대응 리뷰: fds-project-baseline#19 (issuecomment-5627308483), SEC-06
#   - eth0 고정 대신 실제 Worker NIC 이름을 확인 후 반영 (아래 <실제-NIC-이름> 교체 필수)
#   - K8S/ICR(D-NET-01, ICR-D-NET-01-01) 고정 변경안과 통합 — 별도 값 새로 정의 금지
#   - 적용 순서: Bootstrap Allow -> canary Worker 1대 -> Worker 확대 -> CP
#     (docs/runbooks/P1-SEC-01_HEP_GNP_ROLLOUT.md 참조, 순서를 건너뛰지 않는다)
#
# 주의: 이 파일은 "적용 순서" 문서(위 runbook)와 함께 사용한다.
# <실제-NIC-이름>을 확인하지 않은 채 이 Manifest만 단독으로 kubectl apply 하지 않는다.
---
# ── Bootstrap Allow: 최소 SSH/API/etcd/kubelet/Calico/DNS/Harbor 우선 허용 ──
# canary 적용 전, 실패 시 Node 자체가 격리되지 않도록 failsafe 성격의 광범위 허용을 먼저 건다.
apiVersion: crd.projectcalico.org/v1
kind: GlobalNetworkPolicy
metadata:
  name: bootstrap-allow
spec:
  selector: role == 'k8s-worker' || role == 'k8s-cp'
  order: 0
  applyOnForward: true
  types: ["Ingress", "Egress"]
  ingress:
    - action: Allow
      protocol: TCP
      destination:
        ports: [22, 6443, 2379, 2380, 10250, 179]  # SSH, API, etcd, kubelet, BGP
    - action: Allow
      protocol: UDP
      destination:
        ports: [53]
  egress:
    - action: Allow
      protocol: TCP
      destination:
        ports: [22, 6443, 2379, 2380, 10250, 179, 443]  # 443: Harbor(10.1.93.54)
    - action: Allow
      protocol: UDP
      destination:
        ports: [53]
---
# ── HostEndpoint: Worker 3대. interfaceName/expectedIPs는 실측 후 확정 ──
apiVersion: crd.projectcalico.org/v1
kind: HostEndpoint
metadata:
  name: worker01-hep
  labels:
    role: k8s-worker
    rollout-stage: pending  # canary 적용 시 canary, 확대 시 expanded 로 갱신
spec:
  node: k8s-worker01
  interfaceName: <실제-NIC-이름>  # 예: eth0/ens160/enp1s0 — `ip -o link show` 결과로 확정
  expectedIPs:
    - "10.1.93.105"
---
apiVersion: crd.projectcalico.org/v1
kind: HostEndpoint
metadata:
  name: worker02-hep
  labels:
    role: k8s-worker
    rollout-stage: pending
spec:
  node: k8s-worker02
  interfaceName: <실제-NIC-이름>
  expectedIPs:
    - "10.1.93.107"
---
apiVersion: crd.projectcalico.org/v1
kind: HostEndpoint
metadata:
  name: worker03-hep
  labels:
    role: k8s-worker
    rollout-stage: pending
spec:
  node: k8s-worker03
  interfaceName: <실제-NIC-이름>
  expectedIPs:
    - "10.1.93.108"
---
# ── NodePort 30080 preDNAT: edge01(.50) -> Worker만 허용, 나머지 Deny ──
apiVersion: crd.projectcalico.org/v1
kind: GlobalNetworkPolicy
metadata:
  name: nodeport-30080-allow
spec:
  selector: role == 'k8s-worker'
  order: 100
  applyOnForward: true
  preDNAT: true
  types: ["Ingress"]
  ingress:
    - action: Allow
      protocol: TCP
      source:
        nets: ["10.1.93.50/32"]
      destination:
        ports: [30080]
    - action: Deny
      protocol: TCP
      destination:
        ports: [30080]
