# P1-SEC-01 / SEC-04 (High) 수정 — selector/labels 누락으로 독립 apply 불가능했던 문제 교정.
#
# 대응 리뷰: fds-project-baseline#19 (issuecomment-5627308483), SEC-04
#   - 6 Deployment + 1 DaemonSet 전부에 spec.selector / template.metadata.labels 추가
#   - Monitoring 5개 워크로드에 image 필드 명시 (버전은 실제 채택 버전으로 교체 필요)
#   - transaction-api/fds-engine은 APP 원본 Deployment에 적용할 patch로도 사용 가능하도록
#     독립 apply 가능한 완성 Manifest로 제공
#
# <실제-버전>, <확인된-UID>, <확인된-GID>, <approved-digest> 등은 사전확인(§3) 완료 후
# 실측값으로 교체한다. Placeholder 상태로 적용하지 않는다 (baseline P1-SEC-01 원칙).
#
# 2026-09-22 확정 (transaction-api/fds-engine만): Harbor(10.1.93.54)에서 admin 계정으로
# 각 이미지를 실측 pull 후 `getent passwd/group fdsuser`로 확인.
# UID=10001(Dockerfile `useradd -r -u 10001 fdsuser`), GID=999(useradd가 자동 생성한
# fdsuser 전용 그룹의 실제 GID, Dockerfile만으로는 알 수 없어 이미지 내부를 직접 확인함).
# approved-digest는 두 이미지의 Harbor `latest`/`254b822` 태그(2026-09-16 12:42 Push) 기준.
# 모니터링 5개 워크로드(prometheus/alertmanager/grafana/kube-state-metrics/node-exporter)는
# 이미지 버전이 아직 미확정이라 UID/GID/버전 placeholder를 그대로 둔다.
#
# 2026-09-22 실배포 발견: transaction-api는 `DATABASE_URL` 환경변수가 없으면
# app/db.py에서 KeyError로 즉시 크래시한다(fds-msa 저장소 실측, CrashLoopBackOff로
# 발견). Secret(transaction-api-db-credentials, key DATABASE_URL)을 참조하는 env를
# 추가했다. 이 파일은 그 Secret을 만들지 않는다 — DB 비밀번호는 P1-DB-01 담당이
# 별도 채널로 관리하며 여기 하드코딩하지 않는다. fds-engine은 DB에 직접 접근하지
# 않아(NetworkPolicy상 Deny 유지) 이 문제가 없었다.
#
# 범위 정정 (GWONUK 재검토 SEC-04, issuecomment-5644891728):
# 이 파일은 "독립 apply 가능한 완성 Manifest"가 아니라 P1-APP-01/P1-MON-01 원본
# Deployment에 적용할 SecurityContext/RBAC/Probe 관련 patch 참고자료다. SA/PVC/
# ConfigMap 등 참조 리소스는 실제 APP/MON 소스 기준으로 별도 연결이 필요하며,
# UID/GID/image digest는 BLOCKED_INPUT(사전확인 §3 완료 전까지 미확정)이다.
#
# 독립 리뷰 왕복 (supreme33-kr pullrequestreview-5222381683 → GWONUK issuecomment-5697392102
# → supreme33-kr issuecomment-5697508915/5697600122)으로 최종 정리된 방향:
#   - metrics 9091/9090: 정본 계약(transaction-api 9091 / fds-engine 9090 전용 listener)이
#     맞고 당시 앱 코드가 뒤처져 있던 것이었다. supreme33-kr이 앱에 전용 listener를 구현해
#     merge 완료(supreme33-kr/fds-msa#5)했으므로 manifest는 원래 9091/9090 그대로 유지한다.
#     (한때 manifest를 단일 포트로 낮췄던 중간 수정은 철회됨 — 방향 착오였음.)
#   - Grafana edge01->3000 Ingress: 정본이 ClusterIP + 승인 관리단말 port-forward 전용으로
#     의도한 설계였음(GWONUK 반려, supreme33-kr 제안 철회). 추가하지 않는다.
#   - UID/GID/fsGroup(transaction-api/fds-engine=10001, prometheus/alertmanager=65534,
#     grafana=472)은 승인된 Harbor image digest 확정 후 해당 digest의 실제 identity로
#     결합 확정한다 — 지금 하드코딩하지 않는다(supreme33-kr 정정). fsGroupChangePolicy는
#     OnRootMismatch를 채택한다.
#   - Prometheus retention.size=16GB(PVC 20Gi의 80%, Lead 결정 #10 issuecomment-5697547621)
#     는 유지. StorageClass/PV/PVC 오브젝트는 04-storage.yaml에 신설한다(GWONUK/supreme33-kr
#     공동 반영 요청, issuecomment-5697415810/5697483242).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-api
  namespace: fds-app
  labels:
    app: transaction-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: transaction-api
  template:
    metadata:
      labels:
        app: transaction-api
    spec:
      serviceAccountName: transaction-api-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: harbor-pull-secret
      containers:
        - name: transaction-api
          image: 10.1.93.54/fds/transaction-api@sha256:a7093136d12640da00570c18ed278eacbb8e9ba3637c7d509571346eac45cc33
          env:
            # app/db.py가 기동 시 DATABASE_URL 필수(없으면 KeyError로 즉시 크래시,
            # 2026-09-22 실배포 시 CrashLoopBackOff로 발견). Secret은 이 파일이 만들지
            # 않으며, DB 비밀번호는 P1-DB-01 담당(이권욱)이 별도 채널로 관리한다.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: transaction-api-db-credentials
                  key: DATABASE_URL
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8000
            - containerPort: 9091  # 전용 metrics listener (supreme33-kr/fds-msa#5 구현·merge 완료)
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
      hostPID: false
      hostIPC: false
      hostNetwork: false
---
apiVersion: v1
kind: Service
metadata:
  name: transaction-api
  namespace: fds-app
  labels:
    app: transaction-api
spec:
  selector:
    app: transaction-api
  ports:
    # IF-02A(baseline Interface Register): transaction-api Service -> Pod, TCP 80 -> 8000.
    # 1차 제출에서 8000->8000으로 잘못 설정됐던 부분을 GWONUK 재검토(SEC-04)에서
    # 지적받아 계약대로 교정한다.
    - name: http
      port: 80
      targetPort: 8000
    - name: metrics
      port: 9091
      targetPort: 9091
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fds-engine
  namespace: fds-app
  labels:
    app: fds-engine
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fds-engine
  template:
    metadata:
      labels:
        app: fds-engine
    spec:
      serviceAccountName: fds-engine-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: harbor-pull-secret
      containers:
        - name: fds-engine
          image: 10.1.93.54/fds/fds-engine@sha256:5e2a081cd51a957c3fad038b3eab07884c446ea3c2a814a905e3f41c24f67369
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8001
            - containerPort: 9090  # 전용 metrics listener (supreme33-kr/fds-msa#5 구현·merge 완료)
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 20
      hostPID: false
      hostIPC: false
      hostNetwork: false
---
apiVersion: v1
kind: Service
metadata:
  name: fds-engine
  namespace: fds-app
  labels:
    app: fds-engine
spec:
  selector:
    app: fds-engine
  ports:
    - name: grpc
      port: 8001
      targetPort: 8001
    - name: metrics
      port: 9090
      targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring-api
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: <확인된-UID>
        runAsGroup: <확인된-GID>
        fsGroup: <확인된-GID>
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: prom/prometheus:<실제-버전>
          args:
            - --storage.tsdb.retention.time=15d
            - --storage.tsdb.retention.size=16GB  # PVC 20Gi(Lead 결정 #10)의 80%
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tsdb-data
              mountPath: /prometheus
          ports:
            - containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
      hostPID: false
      hostIPC: false
      hostNetwork: false
      volumes:
        - name: tsdb-data
          persistentVolumeClaim:
            claimName: prometheus-pvc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: monitoring-api
  labels:
    app: alertmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      serviceAccountName: alertmanager-sa
      automountServiceAccountToken: false  # D-SEC-01 §4: K8s API 호출 없음
      securityContext:
        runAsNonRoot: true
        runAsUser: <확인된-UID>
        runAsGroup: <확인된-GID>
        fsGroup: <확인된-GID>
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alertmanager
          image: prom/alertmanager:<실제-버전>
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: am-data
              mountPath: /alertmanager
          ports:
            - containerPort: 9093
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9093
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9093
      hostPID: false
      hostIPC: false
      hostNetwork: false
      volumes:
        - name: am-data
          persistentVolumeClaim:
            claimName: alertmanager-pvc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring-api
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      serviceAccountName: grafana-sa
      automountServiceAccountToken: false  # D-SEC-01 §4: K8s API 호출 없음, Prometheus Service만 조회
      securityContext:
        runAsNonRoot: true
        runAsUser: <확인된-UID>
        runAsGroup: <확인된-GID>
        fsGroup: <확인된-GID>
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana
          image: grafana/grafana:<실제-버전>
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-admin-credentials
                  key: GF_SECURITY_ADMIN_USER
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin-credentials
                  key: GF_SECURITY_ADMIN_PASSWORD
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: grafana-data
              mountPath: /var/lib/grafana
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
      hostPID: false
      hostIPC: false
      hostNetwork: false
      volumes:
        - name: grafana-data
          persistentVolumeClaim:
            claimName: grafana-pvc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: monitoring-api
  labels:
    app: kube-state-metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kube-state-metrics
  template:
    metadata:
      labels:
        app: kube-state-metrics
    spec:
      serviceAccountName: kube-state-metrics-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: <확인된-UID>
        runAsGroup: <확인된-GID>
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:<실제-버전>
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
            - containerPort: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
          livenessProbe:
            httpGet:
              path: /livez
              port: 8080
      hostPID: false
      hostIPC: false
      hostNetwork: false
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: monitoring-node
  labels:
    app: node-exporter
spec:
  selector:
    matchLabels:
      app: node-exporter
  template:
    metadata:
      labels:
        app: node-exporter
    spec:
      serviceAccountName: node-exporter-sa
      automountServiceAccountToken: false  # D-SEC-01 §4: K8s API 호출 없음, hostPath로 OS 정보 직접 읽음
      hostNetwork: true
      hostPID: true
      containers:
        - name: node-exporter
          image: prom/node-exporter:<실제-버전>
          args:
            - --path.rootfs=/host/root
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: host-root
              mountPath: /host/root
              readOnly: true
          ports:
            - containerPort: 9100
              hostPort: 9100
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9100
          livenessProbe:
            httpGet:
              path: /metrics
              port: 9100
      volumes:
        - name: host-root
          hostPath:
            path: /
