# SEC-06 2차 수정 — NodePort preDNAT 규칙. Worker 3대(02~04) 전체가 안정화된 뒤에만 적용.
# edge01(.50) -> Worker:30080만 preDNAT 허용, 그 외는 명시적 Deny.
#
# [DRIFT SYNC — 2026-09-22, 확인 완료] 이 GNP는 클러스터에 저장소 리뷰 절차를 거치지 않고
# out-of-band로 직접 적용되어 있었다(재환 독립 리뷰: infra-kubernetes#7 pullrequestreview-5274034835).
# k8s-control01에서 `kubectl --kubeconfig=/etc/kubernetes/admin.conf get globalnetworkpolicy
# nodeport-30080-allow -o yaml`로 실측 대조 완료(2026-09-22): order 50 / preDNAT true /
# applyOnForward true / selector "fds.example/role == 'worker'". order는 100->50으로,
# selector는 role == 'k8s-worker' -> fds.example/role == 'worker'로 동기화했다.
# 관련: fds-project-baseline#90(Closed), #19.
apiVersion: crd.projectcalico.org/v1
kind: GlobalNetworkPolicy
metadata:
  name: nodeport-30080-allow
spec:
  selector: fds.example/role == 'worker'  # 2026-09-22 실측 확인 (k8s-control01 kubectl get -o yaml)
  order: 50  # 2026-09-22 드리프트 동기화: 클러스터 실측값(재환 리뷰) 반영, 기존 100에서 변경
  applyOnForward: true
  preDNAT: true
  types: ["Ingress"]
  ingress:
    - action: Allow
      protocol: TCP
      source:
        nets: ["10.1.93.50/32"]  # edge01
      destination:
        ports: [30080]
    - action: Deny
      protocol: TCP
      destination:
        ports: [30080]
