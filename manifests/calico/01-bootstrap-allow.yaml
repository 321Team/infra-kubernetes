# SEC-06 5차 수정 (GWONUK HEAD 4af1393e 재검토 잔여 차단 #2) — egress TCP22 제거.
#
# 4차 제출 결함:
#   - ingress는 ansible01 단일 source로 좁혔으나 egress 쪽엔 6개 노드 상호 22가 그대로
#     남아있어, 단계적 HEP 전환 중 미보호 노드→노드 SSH가 허용될 수 있었음.
#   - 2026-09-17 실측 중 k8s-worker01(server05 계정)에서 k8s-control01로 SSH 직접 접속이
#     실사용되고 있음을 확인(로그인 이력에 10.1.93.105 출처 기록). 이 경로가 정식 운영
#     절차인지 우연히 열려있던 경로인지는 별도 확인 필요 — OID-01 egress 제거로 이 경로가
#     막히면 실제 운영에 영향이 있을 수 있으므로 Support(이권욱)에게 확인 요청 남김.
#
# SEC-06 4차 수정 (OID-01, supreme33-kr issuecomment-5697293093) — SSH(22) ingress를
# OID-01 관리 Source(ansible01)로 한정.
#
# 3차 제출 결함:
#   - TCP 22(SSH)가 K8s 노드 6대 상호간에 전부 열려있었고 ansible01(10.250.10.10)은
#     source에 아예 없었음 — 정본 IF-07(ansible01 -> K8S 6대 TCP22 FROZEN 계약)과 불일치.
#   - 22를 6443/10250과 같은 규칙에서 분리해 ansible01 단일 source로 한정.
#
# SEC-06 3차 수정 (PR #7 review 5222165841) — DNS egress 목적지 제한 추가.
#
# 2차 제출 결함:
#   - DNS(53) egress에 destination nets 제한이 없어 정본 DNS `.52/.53`보다 넓게 열림.
#   - dns01(10.1.93.52)/dns02(10.1.93.53) 두 목적지로만 TCP/UDP 53을 제한.
#
# SEC-06 2차 수정 (issuecomment-5644891728) — Bootstrap 규칙 자체 모순 제거.
#
# 1차 제출 결함:
#   - BGP Disabled(D34 확정: "BGP Disabled + VXLANCrossSubnet")인데 TCP179(BGP)를 허용 -> 모순.
#     승인 VXLAN(UDP4789)은 빠져있었음.
#   - source/destination 제한 없이 광범위 허용 -> "failsafe 성격"이라는 설명으로 광역
#     허용을 승인하지 않는다는 재검토 지적 반영, 6개 노드로 source/destination을 좁힘.
#
# 이 GNP는 HEP가 없는 상태에서는 어떤 노드에도 집행되지 않으므로(Calico는 HEP가 있는
# 인터페이스에만 정책을 적용), Worker/CP HEP를 아직 만들기 전에 먼저 적용해도 안전하다.
# HEP가 생기는 순간부터 이 규칙이 실제로 집행되기 시작한다.
apiVersion: crd.projectcalico.org/v1
kind: GlobalNetworkPolicy
metadata:
  name: bootstrap-allow
spec:
  selector: role == 'k8s-worker' || role == 'k8s-cp'
  order: 0
  applyOnForward: true
  types: ["Ingress", "Egress"]
  ingress:
    - action: Allow
      protocol: TCP
      source:
        nets: ["10.250.10.10/32"]  # ansible01, OID-01 관리 Source (IF-07 FROZEN 계약)
      destination:
        ports: [22]  # SSH — 노드 간 SSH는 허용하지 않음
        nets:
          - "10.1.93.102/32"  # k8s-control01
          - "10.1.93.103/32"  # k8s-control02
          - "10.1.93.104/32"  # k8s-control03
          - "10.1.93.105/32"  # k8s-worker01
          - "10.1.93.107/32"  # k8s-worker02
          - "10.1.93.108/32"  # k8s-worker03
    - action: Allow
      protocol: TCP
      source:
        nets:
          - "10.1.93.102/32"  # k8s-control01
          - "10.1.93.103/32"  # k8s-control02
          - "10.1.93.104/32"  # k8s-control03
          - "10.1.93.105/32"  # k8s-worker01
          - "10.1.93.107/32"  # k8s-worker02
          - "10.1.93.108/32"  # k8s-worker03
      destination:
        ports: [6443, 10250]  # API(CP만 실제 리스닝), kubelet
    - action: Allow
      protocol: TCP
      source:
        nets: ["10.1.93.102/32", "10.1.93.103/32", "10.1.93.104/32"]  # etcd는 CP-CP 전용
      destination:
        ports: [2379, 2380]
    - action: Allow
      protocol: UDP
      source:
        nets:
          - "10.1.93.102/32"
          - "10.1.93.103/32"
          - "10.1.93.104/32"
          - "10.1.93.105/32"
          - "10.1.93.107/32"
          - "10.1.93.108/32"
      destination:
        ports: [4789]  # VXLAN (BGP Disabled 구성이므로 179 대신 이게 필요)
    # SEC-06 5차 수정 (GWONUK HEAD 4af1393e 재검토 잔여 차단 #1) — NTP 내부 소스(control01)
    # 수신을 위한 ingress. control02/03·Worker 3대가 control01:123으로 보내는 요청을
    # control01이 받으려면 egress(아래)뿐 아니라 이 ingress도 명시적으로 필요하다
    # (이 GNP는 6443/10250처럼 방향별로 별도 규칙을 명시하는 기존 관례를 따름).
    - action: Allow
      protocol: UDP
      source:
        nets:
          - "10.1.93.103/32"  # k8s-control02
          - "10.1.93.104/32"  # k8s-control03
          - "10.1.93.105/32"  # k8s-worker01
          - "10.1.93.107/32"  # k8s-worker02
          - "10.1.93.108/32"  # k8s-worker03
      destination:
        ports: [123]
        nets: ["10.1.93.102/32"]  # k8s-control01 — 내부 유일 NTP 소스
  egress:
    - action: Allow
      protocol: TCP
      destination:
        ports: [6443, 2379, 2380, 10250]  # SEC-06 5차 수정: 22(SSH) 제거 — OID-01 egress 잔존 결함
        nets:
          - "10.1.93.102/32"
          - "10.1.93.103/32"
          - "10.1.93.104/32"
          - "10.1.93.105/32"
          - "10.1.93.107/32"
          - "10.1.93.108/32"
    - action: Allow
      protocol: UDP
      destination:
        ports: [4789]
        nets:
          - "10.1.93.102/32"
          - "10.1.93.103/32"
          - "10.1.93.104/32"
          - "10.1.93.105/32"
          - "10.1.93.107/32"
          - "10.1.93.108/32"
    - action: Allow
      protocol: TCP
      destination:
        ports: [443]
        nets: ["10.1.93.54/32"]  # Harbor — 이미지 pull 경로
    - action: Allow
      protocol: UDP
      destination:
        ports: [53]  # DNS — Host 자체 조회 (Bootstrap DNS, D-NET-01 확정)
        nets: ["10.1.93.52/32", "10.1.93.53/32"]  # dns01/dns02만 허용 (SEC-06 3차 수정)
    - action: Allow
      protocol: TCP
      destination:
        ports: [53]
        nets: ["10.1.93.52/32", "10.1.93.53/32"]  # dns01/dns02만 허용 (SEC-06 3차 수정)
    # SEC-06 5차 수정 — NTP egress. 토폴로지(control01 단일 내부 소스, Relay안 기각)는
    # Lead Decision(이슈#10, 2026-09-16)으로 확정됐다. control01의 upstream(ansible01)은
    # 이 PR 작성자 내부 판단이며 아직 별도 이슈에 공식 게시·Lead Decision 확정되지 않았다
    # — 독립 리뷰·공식 결정 게시 전까지는 PENDING_REVIEW로 취급한다.
    - action: Allow
      protocol: UDP
      source:
        nets:
          - "10.1.93.103/32"  # k8s-control02
          - "10.1.93.104/32"  # k8s-control03
          - "10.1.93.105/32"  # k8s-worker01
          - "10.1.93.107/32"  # k8s-worker02
          - "10.1.93.108/32"  # k8s-worker03
      destination:
        ports: [123]
        nets: ["10.1.93.102/32"]  # k8s-control01만 — 내부 유일 NTP 소스 (Lead Decision 2026-09-16)
    - action: Allow
      protocol: UDP
      source:
        nets: ["10.1.93.102/32"]  # k8s-control01만 — 자신의 upstream으로 나가는 egress
      destination:
        ports: [123]
        nets: ["10.250.10.10/32"]  # ansible01 — control01 upstream (PENDING_REVIEW, 위 주석 참조)
