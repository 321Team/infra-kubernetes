# SEC-06 2차 수정 — canary 1단계. 이 파일만 단독 적용한다 (Worker02/03과 별도 파일).
# interfaceName=ens160 (Lead 결정, supreme33-kr issuecomment-5697260887): 정본 과거 기록과
# Worker 실측 모두 public zone 연결이 ens160으로 관측됨. 단, 적용 직전 노드에서 아래 3개
# read-only 명령 결과가 전부 일치해야 하며 하나라도 불일치하면 STOP하고 재확인한다
# (docs/runbooks/P1-SEC-01_HEP_GNP_ROLLOUT.md 0단계 체크리스트 참조):
#   ip -4 addr show ens160
#   ip route get 10.1.93.254
#   nmcli -g GENERAL.DEVICE,GENERAL.CONNECTION device show ens160
# 적용 후: docs/runbooks/P1-SEC-01_HEP_GNP_ROLLOUT.md의 회귀시험 세트 전체 실행 필수.
apiVersion: crd.projectcalico.org/v1
kind: HostEndpoint
metadata:
  name: worker01-hep
  labels:
    role: k8s-worker
    rollout-stage: canary
spec:
  node: k8s-worker01
  interfaceName: ens160
  expectedIPs:
    - "10.1.93.105"
