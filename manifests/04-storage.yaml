# P1-SEC-01 / Monitoring static local Storage — StorageClass/PV/PVC 신설.
#
# 반영 요청 근거: supreme33-kr issuecomment-5697415810, GWONUK issuecomment-5697483242.
# 용량은 Lead 결정(fds-project-baseline#10 issuecomment-5697547621) 값을 그대로 사용:
#   Prometheus 20Gi / Grafana 5Gi / Alertmanager 2Gi (합계 27Gi)
# 지정 Worker: k8s-worker03(10.1.93.108) — 실측 /home XFS 가용 약 163G로 여유 확인됨.
#
# static local PV 정본 요구(WaitForFirstConsumer + Retain + nodeAffinity)에서
# 필수 nodeAffinity는 PersistentVolume.spec.nodeAffinity다 (GWONUK 지적).
# 각 host path(/home/fds-local-pv/{prometheus,grafana,alertmanager})는 실제 적용 전
# k8s-worker03에 디렉터리 생성·owner/mode·SELinux persistent fcontext 설정이 선행되어야
# 하며, 이 매니페스트 자체가 해당 디렉터리를 만들어주지 않는다.
#
# 2026-10-01 정합: 현장(Runtime)에 실제 적용된 형상은 infra-monitoring
# kubernetes/monitoring/pv-monitoring-storage.yaml 기준이다(StorageClass fds-local-storage,
# PV *-data-pv, PVC prometheus-data/grafana-data/alertmanager-data). 이 파일의 이름을 현장에
# 맞췄다. 운영 중인 PVC가 바인딩돼 있어 StorageClass 재생성 등 Runtime 변경은 하지 않는다.
# 근거 증적: fds-project-evidence evidence/P1-K8S-01/sc-pv-20261001/ (CONFIG_DRIFT=OBSERVED).
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: fds-local-storage
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
# reclaimPolicy는 지정하지 않는다(API 기본값 Delete). 이 StorageClass는 no-provisioner라 동적 PV를 만들지
# 않으며, 바인딩된 정적 PV의 실제 reclaim 동작은 아래 각 PV의 persistentVolumeReclaimPolicy: Retain이 결정한다.
# 현장(Runtime)의 StorageClass가 이 값을 지정하지 않은 상태와 일치시키기 위함(drift 해소, 2026-10-01).
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: prometheus-data-pv
spec:
  capacity:
    storage: 20Gi
  volumeMode: Filesystem
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: fds-local-storage
  local:
    path: /home/fds-local-pv/prometheus
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: ["k8s-worker03"]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: monitoring-api
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: fds-local-storage
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: grafana-data-pv
spec:
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: fds-local-storage
  local:
    path: /home/fds-local-pv/grafana
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: ["k8s-worker03"]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: monitoring-api
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: fds-local-storage
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: alertmanager-data-pv
spec:
  capacity:
    storage: 2Gi
  volumeMode: Filesystem
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: fds-local-storage
  local:
    path: /home/fds-local-pv/alertmanager
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: ["k8s-worker03"]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: alertmanager-data
  namespace: monitoring-api
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: fds-local-storage
  resources:
    requests:
      storage: 2Gi
