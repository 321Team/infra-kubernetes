# P1-SEC-01 / D-SEC-01 §1(Namespace/PSA) 반영 — Namespace 및 Pod Security Admission 라벨.
#
# D-SEC-01 결정 그대로 4개 업무/모니터링 Namespace를 생성한다. kube-system은
# D-SEC-01 "예외 기록 위치" 표에 따라 PSA 전면 미적용(시스템 예외)이므로 이
# 파일이 건드리지 않는다 — 클러스터 기본 Namespace를 그대로 사용.
#
# PSA Version Label(<TBD-P1-K8S-01>)은 P1-K8S-01 Platform Ready 후 `kubectl version`으로
# 확인한 실제 Kubernetes Minor Version(예: v1.33)으로 치환해서 적용한다. 이 PR은
# 이 프로젝트의 기존 관례(<확인된-UID>, <approved-digest> 등과 동일)에 따라 확인 전
# 임의 버전을 확정하지 않는다 — placeholder 상태로 클러스터에 적용하지 않는다.
---
apiVersion: v1
kind: Namespace
metadata:
  name: fds-app
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: <TBD-P1-K8S-01>
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: <TBD-P1-K8S-01>
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: <TBD-P1-K8S-01>
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring-node
  labels:
    # D-SEC-01: Node Exporter의 hostNetwork/hostPID가 기능상 필수라 enforce만
    # Privileged로 격리하고, audit/warn은 Restricted로 유지해 이탈을 계속 감시한다.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: <TBD-P1-K8S-01>
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: <TBD-P1-K8S-01>
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: <TBD-P1-K8S-01>
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring-api
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: <TBD-P1-K8S-01>
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: <TBD-P1-K8S-01>
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: <TBD-P1-K8S-01>
---
apiVersion: v1
kind: Namespace
metadata:
  name: ci-cd
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: <TBD-P1-K8S-01>
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: <TBD-P1-K8S-01>
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: <TBD-P1-K8S-01>
