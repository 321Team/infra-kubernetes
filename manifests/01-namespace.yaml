# P1-SEC-01 / D-SEC-01 §1(Namespace/PSA) 반영 — Namespace 및 Pod Security Admission 라벨.
#
# D-SEC-01 결정 그대로 4개 업무/모니터링 Namespace를 생성한다. kube-system은
# D-SEC-01 "예외 기록 위치" 표에 따라 PSA 전면 미적용(시스템 예외)이므로 이
# 파일이 건드리지 않는다 — 클러스터 기본 Namespace를 그대로 사용.
#
# PSA Version Label은 `kubectl get nodes`로 확인한 실제 클러스터 버전(v1.36.4)의
# Minor Version인 v1.36으로 확정했다(2026-09-22, k8s-control01 실측).
---
apiVersion: v1
kind: Namespace
metadata:
  name: fds-app
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.36
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.36
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring-node
  labels:
    # D-SEC-01: Node Exporter의 hostNetwork/hostPID가 기능상 필수라 enforce만
    # Privileged로 격리하고, audit/warn은 Restricted로 유지해 이탈을 계속 감시한다.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.36
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.36
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring-api
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.36
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.36
---
apiVersion: v1
kind: Namespace
metadata:
  name: ci-cd
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.36
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.36
