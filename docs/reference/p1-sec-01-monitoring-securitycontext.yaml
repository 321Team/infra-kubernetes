# 참고용 문서 — kubectl apply 대상 아님 (infra-kubernetes#7 리뷰 2번, supreme33-kr MON Lead)
#
# 이 파일은 의도적으로 manifests/ 디렉터리 밖(docs/reference/)에 둔다.
# `kubectl apply -f manifests/` 또는 `-f manifests/02-securitycontext.yaml`을
# 실행해도 이 파일은 그 경로에 없어 절대 적용되지 않는다 — 주석만으로는
# apply를 막을 수 없어서(2026-09-27 이재환 재검토, PR #7 #issuecomment-5853704088),
# 객체 자체를 적용 경로 밖으로 옮겼다.
#
# 아래 prometheus/alertmanager/grafana/kube-state-metrics/node-exporter 5개
# Deployment/DaemonSet은 monitoring-api/monitoring-node 워크로드 소유자인
# infra-monitoring의 실제 배포와 이름이 겹친다. 이 파일은 P1-SEC-01의
# SecurityContext/RBAC 설계 의도(least privilege, non-root, seccomp,
# capability drop 등)를 남겨두는 참고자료일 뿐이며, 실제 적용 대상은
# infra-monitoring의 아래 파일이다:
#   prometheus           -> kubernetes/monitoring/prometheus.yaml
#   alertmanager          -> kubernetes/monitoring/alertmanager-deploy.yaml
#   grafana                -> kubernetes/monitoring/grafana.yaml
#   kube-state-metrics    -> kubernetes/monitoring/kube-state-metrics.yaml
#   node-exporter          -> kubernetes/monitoring/node-exporter.yaml
# SA/RBAC 원본도 동일하게 infra-monitoring 쪽에 있다
# (prometheus-rbac.yaml, monitoring-api-serviceaccounts.yaml — infra-monitoring#20).
#
# image/UID/GID의 <placeholder>는 이 파일에서 실측값으로 채울 필요가 없다 —
# 실제 값은 infra-monitoring 쪽 파일에서만 확정한다. 여기 값이 갱신되지
# 않아도 Runtime에 영향이 없다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring-api
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: <확인된-UID>
        runAsGroup: <확인된-GID>
        fsGroup: <확인된-GID>
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: prom/prometheus:<실제-버전>
          # args를 지정하면 이미지 기본 CMD(--config.file, --storage.tsdb.path)가 통째로
          # 대체된다. 두 값을 명시하지 않으면 작업 디렉터리 기준 prometheus.yml을 찾다가 기동에 실패한다.
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=15d
            - --storage.tsdb.retention.size=16GB  # PVC 20Gi(Lead 결정 #10)의 80%
          # LimitRange 기본 limit(512Mi)이 적용되지 않도록 명시한다. 초기값 — MON Lead 확정 필요.
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tsdb-data
              mountPath: /prometheus
            - name: prometheus-config   # P1-MON-01 소유 ConfigMap (scrape/remote_write 설정)
              mountPath: /etc/prometheus
              readOnly: true
          ports:
            - containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
      hostPID: false
      hostIPC: false
      hostNetwork: false
      volumes:
        - name: tsdb-data
          persistentVolumeClaim:
            claimName: prometheus-pvc
        - name: prometheus-config
          configMap:
            name: prometheus-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: monitoring-api
  labels:
    app: alertmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      serviceAccountName: alertmanager-sa
      automountServiceAccountToken: false  # D-SEC-01 §4: K8s API 호출 없음
      securityContext:
        runAsNonRoot: true
        runAsUser: <확인된-UID>
        runAsGroup: <확인된-GID>
        fsGroup: <확인된-GID>
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alertmanager
          image: prom/alertmanager:<실제-버전>
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: am-data
              mountPath: /alertmanager
          ports:
            - containerPort: 9093
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9093
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9093
      hostPID: false
      hostIPC: false
      hostNetwork: false
      volumes:
        - name: am-data
          persistentVolumeClaim:
            claimName: alertmanager-pvc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring-api
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      serviceAccountName: grafana-sa
      automountServiceAccountToken: false  # D-SEC-01 §4: K8s API 호출 없음, Prometheus Service만 조회
      securityContext:
        runAsNonRoot: true
        runAsUser: <확인된-UID>
        runAsGroup: <확인된-GID>
        fsGroup: <확인된-GID>
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana
          image: grafana/grafana:<실제-버전>
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-admin-credentials
                  key: GF_SECURITY_ADMIN_USER
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin-credentials
                  key: GF_SECURITY_ADMIN_PASSWORD
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: grafana-data
              mountPath: /var/lib/grafana
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
      hostPID: false
      hostIPC: false
      hostNetwork: false
      volumes:
        - name: grafana-data
          persistentVolumeClaim:
            claimName: grafana-pvc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: monitoring-api
  labels:
    app: kube-state-metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kube-state-metrics
  template:
    metadata:
      labels:
        app: kube-state-metrics
    spec:
      serviceAccountName: kube-state-metrics-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: <확인된-UID>
        runAsGroup: <확인된-GID>
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:<실제-버전>
          # 06-rbac.yaml kube-state-metrics-role과 같은 범위만 수집한다. 기본값은 secrets 등
          # RBAC 밖 리소스까지 조회해 Forbidden을 반복한다(Secret 읽기 금지 — baseline §8).
          args:
            - --resources=pods,nodes,namespaces,services,endpoints,configmaps,persistentvolumeclaims,persistentvolumes,replicationcontrollers,resourcequotas,deployments,replicasets,daemonsets,statefulsets,jobs,cronjobs
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
            - containerPort: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
          livenessProbe:
            httpGet:
              path: /livez
              port: 8080
      hostPID: false
      hostIPC: false
      hostNetwork: false
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: monitoring-node
  labels:
    app: node-exporter
spec:
  selector:
    matchLabels:
      app: node-exporter
  template:
    metadata:
      labels:
        app: node-exporter
    spec:
      serviceAccountName: node-exporter-sa
      automountServiceAccountToken: false  # D-SEC-01 §4: K8s API 호출 없음, hostPath로 OS 정보 직접 읽음
      hostNetwork: true
      hostPID: true
      # Namespace PSA enforce=privileged는 hostNetwork/hostPID/hostPath 허용을 위한 예외다.
      # 컨테이너 자체는 restricted 수준(non-root, seccomp, drop ALL, RO rootfs)을 유지한다
      # (baseline §8 Monitoring Security Boundary, audit/warn=restricted).
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534   # nobody — prom/node-exporter 이미지 기본 사용자. 승인 digest로 재확인
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: node-exporter
          image: prom/node-exporter:<실제-버전>
          # baseline §8 "불필요 Collector 비활성", P1-MON-01 AC 6 "Collector 목록 Evidence".
          # 이 노드 구성에 없는 장치/파일시스템 Collector를 끈다. 최종 목록은 MON Lead 확정.
          args:
            - --path.rootfs=/host/root
            - --no-collector.wifi
            - --no-collector.infiniband
            - --no-collector.fibrechannel
            - --no-collector.nfs
            - --no-collector.nfsd
            - --no-collector.zfs
            - --no-collector.btrfs
            - --no-collector.tapestats
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: host-root
              mountPath: /host/root
              readOnly: true
              mountPropagation: HostToContainer  # 호스트 하위 마운트(/proc,/sys,데이터 디스크) 반영
          ports:
            - containerPort: 9100
              hostPort: 9100
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9100
          livenessProbe:
            httpGet:
              path: /metrics
              port: 9100
      volumes:
        - name: host-root
          hostPath:
            path: /
