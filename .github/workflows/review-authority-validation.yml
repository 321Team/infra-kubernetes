name: Review authority validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    if: github.repository == '321Team/infra-kubernetes'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout source without stored credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Run isolated Python regression tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
