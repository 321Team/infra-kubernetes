name: IF06B cleanup decision tests
on:
  pull_request:
    paths:
      - 'ops/p1-mon-if06b-cleanup/**'
      - '.github/workflows/if06b-cleanup-decision.yml'
permissions:
  contents: read
jobs:
  offline-decisions:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Synthetic decision, local journal and loopback TLS tests without cluster access
        env:
          IF06B_REQUIRE_FULL: '1'
        run: python3 -B -m unittest discover -s ops/p1-mon-if06b-cleanup/tests -v
