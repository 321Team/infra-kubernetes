name: HTTP Probe bounded controller tests
on:
  pull_request:
    paths:
      - 'ops/p1-http-probe/**'
      - '.github/workflows/http-probe-controller.yml'
permissions:
  contents: read
jobs:
  offline-and-linux-process:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Own child process only; no cluster, credentials or runtime dispatch
        run: python3 -B -m unittest discover -s ops/p1-http-probe/tests -v
